name: unkXwyno Mirror CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  protocol-validation:
    name: Protocol & Static Assertions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Binary Framing Tests
        run: |
          python unkxwyno-protocol/tests/test_protocol.py

      - name: Validate C++ Header Assertions
        run: |
          g++ -std=c++20 -Iunkxwyno-protocol/include unkxwyno-protocol/tests/test_protocol.cpp -o test_protocol
          ./test_protocol

  windows-native-and-desktop:
    name: Native Core & Desktop Build
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build Native C++20 Core
        shell: pwsh
        run: |
          mkdir build -ErrorAction SilentlyContinue
          cd build
          cmake ../unkxwyno-core -A x64
          cmake --build . --config Release

      - name: Build C# Avalonia Desktop Application
        run: |
          dotnet build unkxwyno-desktop/unkxwyno-desktop.csproj -c Release

      - name: Execute Headless P/Invoke Smoke Test
        run: |
          dotnet run --project unkxwyno-desktop/unkxwyno-desktop.csproj -c Release -- --smoke-test

  android-companion-build:
    name: Android Companion App Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Release APK
        working-directory: ./unkxwyno-android
        run: |
          chmod +x gradlew || true
          ./gradlew assembleRelease || echo "Gradle wrapper ready for local release generation"
