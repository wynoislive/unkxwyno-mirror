name: unkXwyno Mirror CI/CD Multiplatform Release Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  protocol-validation:
    name: Protocol & Static Assertions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Binary Framing Tests
        run: |
          python unkxwyno-protocol/tests/test_protocol.py

      - name: Validate C++ Header Assertions
        run: |
          g++ -std=c++20 -Iunkxwyno-protocol/include unkxwyno-protocol/tests/test_protocol.cpp -o test_protocol
          ./test_protocol

  windows-build:
    name: Windows Portable EXE & Bundle
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build Native C++20 Core DLL
        shell: pwsh
        run: |
          mkdir build -ErrorAction SilentlyContinue
          cd build
          cmake ../unkxwyno-core -A x64
          cmake --build . --config Release
          Copy-Item Release/unkxwyno_core.dll ../unkxwyno-core/

      - name: Publish Windows Standalone Portable EXE
        run: |
          dotnet publish unkxwyno-desktop/unkxwyno-desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/windows-x64

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Copy-Item unkxwyno-core/unkxwyno_core.dll dist/windows-x64/
          Compress-Archive -Path dist/windows-x64/* -DestinationPath dist/unkxwyno-mirror-windows-x64.zip

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-bundle
          path: dist/

  macos-dmg-build:
    name: macOS Universal DMG Build
    runs-on: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish macOS Desktop App (Universal/ARM64)
        run: |
          dotnet publish unkxwyno-desktop/unkxwyno-desktop.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=true -o dist/macos-app

      - name: Create DMG Disk Image
        run: |
          mkdir -p dist/dmg_root
          cp -r dist/macos-app/* dist/dmg_root/
          hdiutil create -volname "unkXwyno Mirror" -srcfolder dist/dmg_root -ov -format UDZO dist/unkxwyno-mirror-macos-arm64.dmg

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  linux-app-build:
    name: Linux Portable Package Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish Linux Standalone Binary
        run: |
          dotnet publish unkxwyno-desktop/unkxwyno-desktop.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o dist/linux-x64

      - name: Package Linux Tarball & Script
        run: |
          tar -czvf dist/unkxwyno-mirror-linux-x64.tar.gz -C dist/linux-x64 .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist/*.tar.gz

  android-apk-build:
    name: Android Companion APK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android Release APK
        working-directory: ./unkxwyno-android
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug || gradle assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: unkxwyno-android/app/build/outputs/apk/**/*.apk
